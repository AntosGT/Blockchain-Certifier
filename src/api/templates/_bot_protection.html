{% if turnstile_site_key %}
<div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" style="margin:18px 0 0"></div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
{% if form_token %}<input type="hidden" name="form_token" value="{{ form_token }}">{% endif %}
<div style="position:absolute;left:-5000px;height:0;overflow:hidden" aria-hidden="true">
  <label>{{ tr(lang|default('es'), 'bot.trap_label') }} <input type="text" name="hp_trap_field" tabindex="-1" autocomplete="off" data-lpignore="true"></label>
</div>
