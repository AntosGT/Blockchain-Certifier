# Local test Nginx for the static frontend (the same layout production will have).
# Usage: docker run --rm -d --name prima-frontend-local -p 8060:80 -v <path>/frontend/dist:/usr/share/nginx/html:ro \
#        -v <path>/frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    error_page 404 /404.html;

    location = / { try_files /index.html =404; }
    location = /es { try_files /es.html =404; }
    location = /formulario { try_files /formulario.html =404; }
    location ^~ /solicitudes/ { try_files /estado.html =404; }
    location = /favicon.ico { try_files /favicon.ico =404; }
    location ^~ /static/ { try_files $uri =404; }

    # Application API (reached over the private network in production) and admin dashboard
    location /api/ { proxy_pass http://host.docker.internal:8050; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location /admin { proxy_pass http://host.docker.internal:8050; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /salud { proxy_pass http://host.docker.internal:8050; }
}
